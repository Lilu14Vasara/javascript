<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #4a90e2, #9013fe);
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #4a90e2;
            text-align: center;
            margin-bottom: 20px;
        }

        .search-section, .shop-list, .selected-items {
            margin-bottom: 30px;
        }

        .search-section h2, .shop-list h2, .selected-items h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 22px;
            font-weight: 600;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            color: #555;
            font-size: 14px;
        }

        input, select, button {
            width: calc(100% - 22px);
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus {
            border-color: #4a90e2;
            outline: none;
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.5);
        }

        button {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.3s;
        }

        button:hover {
            background-color: #357abd;
            transform: scale(1.05);
        }

        .shop-list ul, .selected-items ul {
            list-style: none;
            padding: 0;
        }

        .shop-list li, .selected-items li {
            background: #f9f9f9;
            border: 1px solid #ddd;
            margin: 5px 0;
            padding: 10px;
            border-radius: 8px;
        }

        .shop-list li:hover, .selected-items li:hover {
            background: #e9e9e9;
        }

        .error, .success {
            font-size: 14px;
            margin-top: 10px;
        }

        .error {
            color: #e74c3c;
        }

        .success {
            color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Customer Dashboard</h1>
        
        <div class="search-section">
            <h2>Search for Shops</h2>
            <form id="searchForm">
                <label for="searchItem">Search by Item or Shop Name:</label>
                <input type="text" id="searchItem" name="searchItem" placeholder="Enter item or shop name" required>
                
                <button type="submit">Search</button>
            </form>
        </div>

        <div class="shop-list">
            <h2>Available Shops</h2>
            <ul id="shopList">
                <!-- Example list items. In a real application, these would be dynamically generated. -->
                <li>Shop 1 - Grocery</li>
                <li>Shop 2 - Electronics</li>
                <li>Shop 3 - Clothing</li>
            </ul>
        </div>

        <div class="selected-items">
            <h2>Selected Items</h2>
            <ul id="selectedItems">
                <!-- Example list items. In a real application, these would be dynamically generated. -->
                <li>Item 1 - $10</li>
                <li>Item 2 - $20</li>
            </ul>
        </div>

        <div id="message" class="success"></div>
    </div>

    <script>
        document.getElementById('searchForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const searchItem = document.getElementById('searchItem').value;
            const message = document.getElementById('message');
            
            // Example search validation
            if (searchItem) {
                // Here you would typically filter or search for shops based on the input
                message.textContent = `Searching for "${searchItem}"...`;
                message.className = 'success';
                // Example: Update shopList with filtered results
                document.getElementById('shopList').innerHTML = `
                    <li>Filtered Shop 1 - Example Type</li>
                    <li>Filtered Shop 2 - Example Type</li>
                `;
            } else {
                message.textContent = 'Please enter a search term!';
                message.className = 'error';
            }
        });
    </script>
</body>
</html>
