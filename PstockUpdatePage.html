<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Update</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            color: #333;
        }

        .stock-update-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #4a90e2;
            text-align: center;
            margin-bottom: 20px;
        }

        #stockDetails {
            margin-bottom: 30px;
        }

        .stock-details-item {
            background: #f9f9f9;
            border: 1px solid #ddd;
            margin: 5px 0;
            padding: 10px;
            border-radius: 4px;
        }

        .stock-details-item:nth-child(even) {
            background: #e9e9e9;
        }

        button {
            display: block;
            width: 200px;
            margin: 20px auto;
            padding: 10px;
            background-color: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>
    <div class="stock-update-container">
        <h1>Stock Update</h1>
        <div id="stockDetails">
            <!-- Stock details will be populated here -->
            <div class="stock-details-item">Item 1: Quantity 50</div>
            <div class="stock-details-item">Item 2: Quantity 30</div>
            <div class="stock-details-item">Item 3: Quantity 20</div>
        </div>
        
        <button onclick="window.location.href='index.html'">Logout</button>
    </div>
</body>
</html>
