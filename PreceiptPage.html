<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #4a90e2, #9013fe);
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #4a90e2;
            text-align: center;
            margin-bottom: 20px;
        }

        .receipt-details, .total, .payment-status {
            margin-bottom: 30px;
        }

        .receipt-details h2, .total h2, .payment-status h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 22px;
            font-weight: 600;
        }

        .receipt-details ul {
            list-style: none;
            padding: 0;
        }

        .receipt-details li {
            background: #f9f9f9;
            border: 1px solid #ddd;
            margin: 5px 0;
            padding: 10px;
            border-radius: 8px;
        }

        .receipt-details li:nth-child(even) {
            background: #e9e9e9;
        }

        .total {
            font-size: 18px;
            font-weight: 600;
            margin-top: 10px;
        }

        .payment-status {
            text-align: center;
        }

        .success {
            color: #2ecc71;
        }

        .error {
            color: #e74c3c;
        }

        .download-button {
            display: block;
            width: 200px;
            margin: 20px auto;
            padding: 10px;
            text-align: center;
            background-color: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Receipt</h1>
        
        <div class="receipt-details">
            <h2>Item Details</h2>
            <ul id="receiptItems">
                <!-- Example list items. In a real application, these would be dynamically generated. -->
                <li>Item 1 - Quantity: 2 - $20.00</li>
                <li>Item 2 - Quantity: 1 - $15.00</li>
            </ul>
        </div>

        <div class="total">
            <h2>Total Amount</h2>
            <div id="totalAmount">$35.00</div>
        </div>

        <div class="payment-status" id="paymentStatus">
            <!-- Status message will be dynamically added here -->
        </div>

        <button class="download-button" id="downloadReceipt">Download Receipt</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Example data - replace with dynamic data in a real application
            const receiptItems = [
                { name: 'Item 1', quantity: 2, price: 10.00 },
                { name: 'Item 2', quantity: 1, price: 15.00 }
            ];

            const totalAmount = receiptItems.reduce((total, item) => total + (item.price * item.quantity), 0);

            const receiptItemsList = document.getElementById('receiptItems');
            const totalAmountElement = document.getElementById('totalAmount');
            const paymentStatus = document.getElementById('paymentStatus');
            const downloadButton = document.getElementById('downloadReceipt');

            receiptItems.forEach(item => {
                const listItem = document.createElement('li');
                listItem.textContent = `${item.name} - Quantity: ${item.quantity} - $${(item.price * item.quantity).toFixed(2)}`;
                receiptItemsList.appendChild(listItem);
            });

            totalAmountElement.textContent = `$${totalAmount.toFixed(2)}`;

            // Example payment status - Replace with actual payment status logic
            const paymentSuccess = true; // Set to `false` to simulate payment failure
            if (paymentSuccess) {
                paymentStatus.textContent = 'Payment was successful!';
                paymentStatus.className = 'payment-status success';
            } else {
                paymentStatus.textContent = 'Payment failed. Please try again.';
                paymentStatus.className = 'payment-status error';
            }

            // Download functionality
            downloadButton.addEventListener('click', function() {
                const receiptText = `
Receipt\n
Item Details:
${receiptItems.map(item => `${item.name} - Quantity: ${item.quantity} - $${(item.price * item.quantity).toFixed(2)}`).join('\n')}

Total Amount:
$${totalAmount.toFixed(2)}

Payment Status:
${paymentSuccess ? 'Payment was successful!' : 'Payment failed. Please try again.'}
                `.trim();

                const blob = new Blob([receiptText], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'receipt.txt';
                link.click();
            });
        });
    </script>
</body>
</html>
