<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #4203a9, #90bafc);
            color: #fff;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .calculator {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        .calculator h1 {
            font-size: 60px;
        }
        .calculator h1 span {
            color: #ffff76;
        }
        .inputBox {
            margin-top: 40px;
            padding: 35px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .inputBox input {
            width: 100%;
            max-width: 300px;
            padding: 14px 20px;
            border: 2px solid #fff;
            border-radius: 5px;
            font-size: 18px;
            color: #333;
            background: #fff;
            outline: none;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
        }
        .inputBox input::placeholder {
            color: #999;
        }
        .inputBox button {
            margin-top: 20px;
            background: #ffff76;
            padding: 15px 80px;
            border: 0;
            outline: 0;
            font-size: 18px;
            border-radius: 5px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .inputBox button:hover {
            background: #f0f0f0;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <h1>JavaScript <br><span> Age Calculator</span></h1>
            <div class="inputBox">
                <input type="date" id="date" placeholder="Select a date">
                <button onclick="calculateAge()">Calculate</button>
                <div class="result" id="result"></div> <!-- Added result div to display age -->
            </div>
        </div>
    </div>
    
    <script>
        let userInput = document.getElementById("date");
        let today = new Date().toISOString().split('T')[0];
        userInput.max = today;

        function calculateAge() {
            const birthDate = new Date(userInput.value);
            const today = new Date();

            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();

            // Adjust days and months if days are negative
            if (days < 0) {
                months--;
                const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += lastMonth.getDate(); // Add the number of days in the last month
            }

            // Adjust years if months are negative
            if (months < 0) {
                years--;
                months += 12;
            }

            // Display the result
            document.getElementById('result').innerHTML = `
                ${years} years, ${months} months, and ${days} days
            `;
        }
    </script>
</body>
</html>
