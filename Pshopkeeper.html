<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopkeeper Dashboard</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #4a90e2, #9013fe);
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #4a90e2;
            text-align: center;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 22px;
            font-weight: 600;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            color: #555;
            font-size: 14px;
        }

        input, select, button {
            width: calc(100% - 22px);
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus {
            border-color: #4a90e2;
            outline: none;
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.5);
        }

        button {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.3s;
        }

        button:hover {
            background-color: #357abd;
            transform: scale(1.05);
        }

        .error, .success {
            font-size: 14px;
            margin-top: 10px;
        }

        .error {
            color: #e74c3c;
        }

        .success {
            color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shopkeeper Dashboard</h1>
        
        <div class="section">
            <h2>Shop Information</h2>
            <form id="shopForm">
                <label for="shopName">Shop Name:</label>
                <input type="text" id="shopName" name="shopName" required>
                
                <label for="shopType">Shop Type:</label>
                <select id="shopType" name="shopType" required>
                    <option value="grocery">Grocery</option>
                    <option value="clothing">Clothing</option>
                    <option value="electronics">Electronics</option>
                    <option value="furniture">Furniture</option>
                </select>
                
                <label for="itemName">Item Name:</label>
                <input type="text" id="itemName" name="itemName" required>
                
                <label for="itemQuantity">Item Quantity:</label>
                <input type="number" id="itemQuantity" name="itemQuantity" required>
                
                <button type="submit">Add Item</button>
            </form>
        </div>

        <div class="section">
            <h2>Update Inventory</h2>
            <form id="updateForm">
                <label for="updateItemName">Item Name:</label>
                <input type="text" id="updateItemName" name="updateItemName" required>
                
                <label for="updateQuantity">New Quantity:</label>
                <input type="number" id="updateQuantity" name="updateQuantity" required>
                
                <button type="submit">Update Quantity</button>
            </form>
        </div>

        <div id="message" class="success"></div>
    </div>

    <script>
        document.getElementById('shopForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const shopName = document.getElementById('shopName').value;
            const shopType = document.getElementById('shopType').value;
            const itemName = document.getElementById('itemName').value;
            const itemQuantity = document.getElementById('itemQuantity').value;
            const message = document.getElementById('message');
            
            // Example form validation
            if (shopName && shopType && itemName && itemQuantity) {
                message.textContent = `Item '${itemName}' added to '${shopName}' (${shopType}) with quantity ${itemQuantity}.`;
                message.className = 'success';
            } else {
                message.textContent = 'Please fill in all fields!';
                message.className = 'error';
            }
        });

        document.getElementById('updateForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const updateItemName = document.getElementById('updateItemName').value;
            const updateQuantity = document.getElementById('updateQuantity').value;
            const message = document.getElementById('message');
            
            // Example form validation
            if (updateItemName && updateQuantity) {
                message.textContent = `Quantity for '${updateItemName}' updated to ${updateQuantity}.`;
                message.className = 'success';
            } else {
                message.textContent = 'Please fill in all fields!';
                message.className = 'error';
            }
        });
    </script>
</body>
</html>
