<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Text</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        * {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: sans-serif;
  background: #000;
  color: #fff;
}

p {
  font-size: 3rem;
}

.js {
  color: #fdfdfc;
}

.typed-text {
  color: #de8512;
}

.cursor {
  background: #dbe912;
}

    </style>
  </head>
  <body>
    <p>
      <span class="js">JavaScript</span> Is <span class="typed-text"></span>
      <span class="cursor">&nbsp;</span>
    </p>

    <script >
        const typedTextSpan = document.querySelector('.typed-text');
const cursor = document.querySelector('.cursor');

const words = ['Lilu', 'You Can do it', 'mast', 'yarr', 'dar mat'];
const typingSpeed = 150; 
const erasingSpeed = 100; 
const newWordDelay = 1000; 

let wordIndex = 0;
let letterIndex = 0;
let isTyping = true;

function type() {
    if (letterIndex < words[wordIndex].length) {
        if (isTyping) {
            typedTextSpan.textContent += words[wordIndex][letterIndex];
            letterIndex++;
            setTimeout(type, typingSpeed);
        }
    } else {
        isTyping = false;
        setTimeout(erase, newWordDelay);
    }
}

function erase() {
    if (letterIndex > 0) {
        typedTextSpan.textContent = words[wordIndex].substring(0, letterIndex - 1);
        letterIndex--;
        setTimeout(erase, erasingSpeed);
    } else {
        isTyping = true;
        wordIndex = (wordIndex + 1) % words.length;
        setTimeout(type, typingSpeed);
    }
}


type();

    </script>
  </body>
</html>
