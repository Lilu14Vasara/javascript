<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #4a90e2, #9013fe);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2), inset 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 360px;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 120%;
            height: 120%;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.2), rgba(0, 0, 0, 0.2));
            border-radius: 50%;
            z-index: 0;
            transform: rotate(-30deg);
        }

        .login-container h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .login-container form {
            position: relative;
            z-index: 1;
        }

        .login-container label {
            display: block;
            margin: 10px 0 5px;
            color: #555;
            font-size: 14px;
        }

        .login-container input, 
        .login-container select {
            width: calc(100% - 22px);
            padding: 12px;
            margin: 8px 0 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .login-container input:focus, 
        .login-container select:focus {
            border-color: #4a90e2;
            outline: none;
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.5);
        }

        .login-container button {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.3s;
            position: relative;
            z-index: 1;
        }

        .login-container button:hover {
            background-color: #357abd;
            transform: scale(1.05);
        }

        .login-container .error, 
        .login-container .success {
            font-size: 14px;
            margin-top: 10px;
        }

        .login-container .error {
            color: #e74c3c;
        }

        .login-container .success {
            color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <form id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <label for="userType">Login as:</label>
            <select id="userType" name="userType" required>
                <option value="shopkeeper">Shopkeeper</option>
                <option value="customer">Customer</option>
            </select>
            
            <button type="submit">Login</button>
        </form>
        <div id="message" class="success"></div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const userType = document.getElementById('userType').value;
            const message = document.getElementById('message');
            
            // Example login validation
            if (userType === 'shopkeeper') {
                message.textContent = 'Logging in as Shopkeeper...';
                message.className = 'success';
                setTimeout(() => window.location.href = 'Pshopkeeper.html', 1000);
            } else if (userType === 'customer') {
                message.textContent = 'Logging in as Customer...';
                message.className = 'success';
                setTimeout(() => window.location.href = 'Pcustomer.html', 1000);
            } else {
                message.textContent = 'Invalid user type selected!';
                message.className = 'error';
            }
        });
    </script>
</body>
</html>
